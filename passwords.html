<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunBoard - 密碼區</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/storage.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/modal.js"></script>
    <style>
        .search-input:focus {
            border-color: var(--accent-color) !important;
        }
    </style>
</head>
<body>
    <div id="sidebar"></div>
    <div class="main-content">
        <!-- 未連線提示 -->
        <div id="no-data-msg" style="text-align: center; padding-top: 100px;">
            <h2 style="color: var(--text-secondary); margin-bottom: 15px;">請先點擊左下角「選擇 data.json」按鈕</h2>
            <p style="color: #666;">授權後即可在此網頁直接新增、修改，並自動儲存回該檔案。</p>
        </div>

        <!-- 內容呈現區 -->
        <div id="app-container" style="display: none; max-width: 800px;">
            <div class="section-header">
                <h2 class="section-title">🔒 密碼區</h2>
                <button class="btn btn-small" onclick="PasswordsApp.openAddPassword()">＋新增密碼</button>
            </div>
            <div class="search-box" style="margin-bottom: 20px;">
                <input type="text" id="pwd-search-input" placeholder="🔍 搜尋平台或帳號..." class="search-input" style="width: 100%; padding: 10px 14px; background: var(--sidebar-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 14px; outline: none; box-sizing: border-box;">
            </div>
            <div id="passwords-list"></div>
        </div>
    </div>
    <script src="js/passwords.js"></script>
</body>
</html>
