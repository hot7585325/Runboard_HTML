<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunBoard - 通用檔案過濾編輯器</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/smart_editor.css">
    
    <!-- CodeMirror (Editor) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>

    <!-- Tabulator (Modern Data Grid for CSV & Excel) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabulator/5.5.2/css/tabulator_midnight.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tabulator/5.5.2/js/tabulator.min.js"></script>

    <!-- JSONEditor (Tree Visualizer & Editor) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/9.10.4/jsoneditor.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/9.10.4/jsoneditor.min.js"></script>

    <!-- Marked.js (Markdown Preview) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- SheetJS (Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Mammoth.js (Word) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.5.1/mammoth.browser.min.js"></script>

    <script src="js/nav.js"></script>
</head>
<body>
    <div id="sidebar"></div>
    <div class="main-content" style="padding: 0;">
        
        <div id="no-data-msg" class="empty-state" style="margin-top: 100px;">
            <h2>尚未選取檔案</h2>
            <p>支援格式：.txt, .md, .csv, .json, .xlsx, .docx</p>
            <br>
            <button id="btn-initial-open" class="btn primary">📂 選取本機檔案</button>
        </div>

        <div id="app-container" style="display: none; height: 100%;">
            <div class="smart-editor-container">
                <!-- 頂部工具列 -->
                <div class="toolbar">
                    <button id="btn-open" class="btn-tool">📂 開啟檔案</button>
                    <button id="btn-save" class="btn-tool primary" style="display: none;">💾 儲存修改</button>
                    <button id="btn-toggle-preview" class="btn-tool" style="display: none;">👁️ 切換預覽</button>
                    <button id="btn-toggle-csv-raw" class="btn-tool" style="display: none;">🔄 切換原始碼/表格</button>
                    <button id="btn-toggle-json-raw" class="btn-tool" style="display: none;">🔄 切換原始碼/樹狀</button>
                    <button id="btn-open-search" class="btn-tool">🔍 搜尋/過濾</button>
                    <span id="file-name-display" class="file-name"></span>
                </div>

                <!-- 主要內容呈現區 (100% 滿版) -->
                <div class="main-viewport">
                    <!-- 1. 純文字 / 程式碼 CodeMirror 容器 -->
                    <div id="single-editor-container" class="view-panel" style="display: none;">
                        <div id="editor-container"></div>
                    </div>

                    <!-- 2. Markdown 專用可拖拉雙欄容器 -->
                    <div id="split-container" class="split-view-container" style="display: none;">
                        <div id="split-left" class="split-pane">
                            <div id="md-editor-container"></div>
                        </div>
                        <div id="split-resizer" class="split-resizer" title="左右拖拉調整比例"></div>
                        <div id="split-right" class="split-pane">
                            <div id="md-preview-paper" class="md-preview-body"></div>
                        </div>
                    </div>

                    <!-- 3. Word 專屬 A4 紙張預覽容器 -->
                    <div id="word-container" class="view-panel doc-viewport" style="display: none;">
                        <div id="word-paper" class="doc-paper"></div>
                    </div>

                    <!-- 4. Tabulator 表格容器 (CSV & Excel) -->
                    <div id="grid-container" class="view-panel" style="display: none; height: 100%;"></div>

                    <!-- 5. JSON 專屬樹狀視覺化編輯器容器 -->
                    <div id="json-tree-container" class="view-panel" style="display: none; height: 100%;"></div>
                </div>

                <!-- 抽屜式/滑出式搜尋面板 (預設隱藏) -->
                <div id="search-drawer" class="search-drawer">
                    <div class="drawer-header">
                        <span class="drawer-title">🔍 搜尋與過濾</span>
                        <button id="btn-close-search" class="btn-icon" title="關閉">✕</button>
                    </div>
                    <div class="drawer-body">
                        <input type="text" id="search-input" class="filter-input" placeholder="輸入關鍵字或 Regex...">
                        <span id="filter-stats" class="filter-stats">共 0 筆結果</span>
                        <div id="filter-results" class="filter-results">
                            <!-- 搜尋結果項目 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="js/smart_editor.js"></script>
</body>
</html>
