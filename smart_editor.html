<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunBoard - 通用檔案過濾編輯器</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/smart_editor.css">
    
    <!-- CodeMirror (Editor) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>

    <!-- Marked.js (Markdown Preview) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- SheetJS (Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Mammoth.js (Word) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.5.1/mammoth.browser.min.js"></script>

    <script src="js/nav.js"></script>
</head>
<body>
    <div id="sidebar"></div>
    <div class="main-content" style="padding: 0;">
        
        <div id="no-data-msg" class="empty-state" style="margin-top: 100px;">
            <h2>尚未選取檔案</h2>
            <p>支援格式：.txt, .md, .csv, .json, .xlsx, .docx</p>
            <br>
            <button id="btn-initial-open" class="btn primary">📂 選取本機檔案</button>
        </div>

        <div id="app-container" style="display: none; height: 100%;">
            <div class="smart-editor-container">
                <!-- 左側主畫面 -->
                <div class="left-pane">
                    <div class="toolbar">
                        <button id="btn-open" class="btn-tool">📂 開啟檔案</button>
                        <button id="btn-save" class="btn-tool primary" style="display: none;">💾 儲存修改</button>
                        <button id="btn-toggle-preview" class="btn-tool" style="display: none;">👁️ 切換預覽</button>
                        <span id="file-name-display" class="file-name"></span>
                    </div>
                    <div class="content-area">
                        <!-- CodeMirror 容器 -->
                        <div id="editor-container"></div>
                        <!-- Markdown / Word 預覽容器 -->
                        <div id="preview-container"></div>
                        <!-- Excel 預覽容器 -->
                        <div id="excel-container"></div>
                    </div>
                </div>

                <!-- 右側過濾提取面板 -->
                <div class="right-pane">
                    <div class="filter-header">
                        <input type="text" id="search-input" class="filter-input" placeholder="過濾關鍵字 / Regex...">
                        <span id="filter-stats" class="filter-stats">請先載入檔案</span>
                    </div>
                    <div id="filter-results" class="filter-results">
                        <!-- 搜尋結果項目 -->
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="js/smart_editor.js"></script>
</body>
</html>
